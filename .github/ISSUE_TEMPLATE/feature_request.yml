name: Feature request
description: Suggest a capability or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        AirBridge keeps a deliberately small permission surface: no Accessibility
        service, no notification listener, no call-log access, no analytics. Ideas
        that work inside those constraints are very welcome.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow, not just the missing button.
      placeholder: I move photos from my phone to a Linux box nightly and want the receive folder to be per-device.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like AirBridge to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives you have tried
      description: Including other tools — honest comparisons help.
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require an Accessibility service, notification listener or call-log permission.
          required: true
        - label: This does not require weakening encryption, consent prompts or the pairing model.
          required: true
        - label: This does not require adding analytics, ads or a mandatory account.
          required: true
