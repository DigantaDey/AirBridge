name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    name: Desktop (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Package linux-x64 (vite + embed + bun)
        run: node scripts/build-desktop.mjs --only linux-x64

  android:
    name: Android (engine vectors + app APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Engine vectors + typecheck + debug APK
        run: gradle -p android check :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: airbridge-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
