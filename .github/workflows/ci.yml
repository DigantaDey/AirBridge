name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    name: Desktop (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Package linux-x64 (vite + embed + bun)
        run: node scripts/build-desktop.mjs --only linux-x64

  android:
    name: Android (engine vectors + app APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Use the runner image's preinstalled Android SDK (third-party setup
      # actions lag image migrations); install exactly what we compile against.
      - name: Ensure Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error title=Android SDK missing::No Android SDK at $SDK_ROOT (ANDROID_HOME=${ANDROID_HOME:-unset})"
            exit 1
          fi
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          if [ -z "$SDKMGR" ]; then
            echo "::error title=sdkmanager missing::No sdkmanager under $SDK_ROOT/cmdline-tools — runner image layout changed"
            exit 1
          fi
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -5
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.14.3
      # :engine:check (vectors) + assembleDebug only — root `check` would also
      # run :app:lint, which is not part of this gate.
      - name: Engine vectors + typecheck + debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p android :engine:check :app:assembleDebug --no-daemon 2>&1 | tee gradle-build.log || {
            echo "::error title=Android Gradle build failed::$(tail -n 40 gradle-build.log | tr '\n' '|' | cut -c1-3000)"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: airbridge-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
