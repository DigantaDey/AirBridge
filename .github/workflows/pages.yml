name: Deploy website to GitHub Pages

# This is the ONLY Pages workflow. It publishes `website/` (the standalone
# marketing site). Never publish the repository root here: its index.html is the
# Vite dev shell (`<div id="root">` + /src/client/main.tsx) which needs a bundler
# and renders blank when served as static files — that is what airbridge.fyi used
# to show.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/build-site-pages.mjs'
      - 'scripts/site-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Sanity-check the published site
        run: |
          set -euo pipefail
          test -f website/index.html || { echo "::error title=missing website::website/index.html not found"; exit 1; }
          test -f website/privacy.html || { echo "::error title=missing privacy::website/privacy.html not found"; exit 1; }
          test -f website/404.html || { echo "::error title=missing 404::website/404.html not found"; exit 1; }
          test -f website/styles.css || { echo "::error title=missing styles::website/styles.css not found"; exit 1; }
          for page in website/index.html website/privacy.html website/404.html; do
            if grep -q 'src/client/main.tsx' "$page"; then
              echo "::error title=dev shell published::$page references the Vite dev entry"
              exit 1
            fi
            if grep -Eq '(src|href)="/' "$page"; then
              echo "::error title=absolute asset path::$page must use relative paths for Pages subpaths"
              exit 1
            fi
          done
          # Guide pages are generated from scripts/site-pages/ and must obey the
          # same rules: relative assets, a canonical URL, and a page description.
          for page in website/*.html; do
            if grep -Eq '(src|href)="/' "$page"; then
              echo "::error title=absolute asset path::$page must use relative paths for Pages subpaths"
              exit 1
            fi
            if [ "$page" != "website/404.html" ]; then
              grep -q 'rel="canonical"' "$page" || { echo "::error title=missing canonical::$page has no canonical URL"; exit 1; }
              grep -q 'name="description"' "$page" || { echo "::error title=missing description::$page has no meta description"; exit 1; }
            fi
          done
          for asset in website/og.png website/sitemap.xml website/robots.txt website/styles.css website/screenshots/desktop-file-transfer.jpg; do
            test -f "$asset" || { echo "::error title=missing asset::$asset not found"; exit 1; }
          done
      - name: Verify generated pages are up to date
        run: |
          set -euo pipefail
          node scripts/build-site-pages.mjs > /dev/null
          if ! git diff --quiet -- website; then
            git --no-pager diff --stat -- website
            echo "::error title=stale generated pages::website/ is out of date — run 'npm run website:pages' and commit the result"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    name: Deploy
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
