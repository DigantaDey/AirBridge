name: Release

on:
  push:
    tags: ['v*']
  # Cut a release without touching your laptop: Actions → Release → Run workflow.
  # The inputs.version tag (e.g. 1.2.0) is created at the commit being built, so
  # install.sh / install.ps1 (which read releases/latest/download/…) pick it up.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.2.0 (defaults to package.json)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop-linux-windows:
    name: Linux + Windows binaries (bun cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Linux targets
        run: node scripts/build-desktop.mjs --only linux
      - name: Build Windows targets (reuse embedded client)
        run: node scripts/build-desktop.mjs --only windows --skip-client
      - name: Verify asset names
        run: |
          set -euo pipefail
          ls -l dist-bin
          for want in AirBridge-linux-x64 AirBridge-linux-arm64 \
                      AirBridge-linux-x64-musl AirBridge-linux-arm64-musl \
                      AirBridge-windows-x64.exe AirBridge-windows-arm64.exe; do
            test -f "dist-bin/$want" || { echo "::error title=missing artifact::$want was not built"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-windows
          path: |
            dist-bin/AirBridge-linux-*
            dist-bin/AirBridge-windows-*
          if-no-files-found: error

  desktop-darwin:
    name: macOS binaries (ad-hoc signed)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build darwin targets
        run: node scripts/build-desktop.mjs --only darwin
      # Ad-hoc signature: unsigned darwin-arm64 binaries are killed by the
      # kernel on Apple Silicon. This keeps distribution free (no $99/yr
      # Apple Developer account, no notarization).
      - name: Ad-hoc sign
        run: |
          set -euo pipefail
          ls -l dist-bin
          for f in dist-bin/AirBridge-darwin-*; do
            codesign --force -s - "$f"
            codesign --verify --verbose=2 "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-darwin
          path: dist-bin/AirBridge-darwin-*
          if-no-files-found: error

  android-apk:
    name: Android APK (sideload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Use the runner image's preinstalled Android SDK (third-party setup
      # actions lag image migrations); install exactly what we compile against.
      - name: Ensure Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error title=Android SDK missing::No Android SDK at $SDK_ROOT (ANDROID_HOME=${ANDROID_HOME:-unset})"
            exit 1
          fi
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          if [ -z "$SDKMGR" ]; then
            echo "::error title=sdkmanager missing::No sdkmanager under $SDK_ROOT/cmdline-tools — runner image layout changed"
            exit 1
          fi
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -5
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.14.3
      - name: Assemble release APK (ci sideload key)
        env:
          AIRBRIDGE_VERSION_CODE: ${{ github.run_number }}
        shell: bash
        run: |
          set -o pipefail
          gradle -p android :engine:vectorTest :app:assembleRelease --no-daemon 2>&1 | tee gradle-build.log || {
            echo "::error title=Android release build failed::$(tail -n 40 gradle-build.log | tr '\n' '|' | cut -c1-3000)"
            exit 1
          }
      - name: Name artifact
        run: mkdir -p dist-bin && cp android/app/build/outputs/apk/release/app-release.apk dist-bin/AirBridge.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-bin/AirBridge.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [desktop-linux-windows, desktop-darwin, android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-bin
          merge-multiple: true
      - name: Resolve release tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${INPUT_VERSION:-}"
            if [ -z "$tag" ]; then
              tag="$(node -p "require('./package.json').version")"
            fi
            case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "Resolved release tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Checksums
        working-directory: dist-bin
        run: |
          set -euo pipefail
          ls -l
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort \
            | xargs -r sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-bin/* --clobber
          else
            gh release create "$TAG" dist-bin/* \
              --target "$GITHUB_SHA" \
              --title "AirBridge $TAG" \
              --generate-notes \
              --latest
          fi
