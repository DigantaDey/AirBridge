name: Release

on:
  push:
    tags: ['v*']
  # Cut a release without touching your laptop: Actions → Release → Run workflow.
  # The inputs.version tag (e.g. 1.2.0) is created at the commit being built, so
  # install.sh / install.ps1 (which read releases/latest/download/…) pick it up.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.2.0 (defaults to package.json)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop-linux-windows:
    name: Linux + Windows binaries (bun cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Linux targets
        run: node scripts/build-desktop.mjs --only linux
      - name: Build Windows targets (reuse embedded client)
        run: node scripts/build-desktop.mjs --only windows --skip-client
      - name: Verify asset names
        run: |
          set -euo pipefail
          ls -l dist-bin
          for want in AirBridge-linux-x64 AirBridge-linux-arm64 \
                      AirBridge-linux-x64-musl AirBridge-linux-arm64-musl \
                      AirBridge-windows-x64.exe AirBridge-windows-arm64.exe; do
            test -f "dist-bin/$want" || { echo "::error title=missing artifact::$want was not built"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-windows
          path: |
            dist-bin/AirBridge-linux-*
            dist-bin/AirBridge-windows-*
          if-no-files-found: error

  desktop-darwin:
    name: macOS binaries (ad-hoc signed)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build darwin targets
        run: node scripts/build-desktop.mjs --only darwin
      # Ad-hoc signature: unsigned darwin-arm64 binaries are killed by the
      # kernel on Apple Silicon. This keeps distribution free (no $99/yr
      # Apple Developer account, no notarization).
      - name: Ad-hoc sign
        run: |
          set -euo pipefail
          ls -l dist-bin
          for f in dist-bin/AirBridge-darwin-*; do
            codesign --force -s - "$f"
            codesign --verify --verbose=2 "$f"
          done
      # Prebuilt AirBridge.app (Swift shell + embedded service), so users need
      # neither Xcode nor swiftc. The in-app updater installs these zips.
      - name: Package AirBridge.app (arm64 + x64)
        run: |
          set -euo pipefail
          bash scripts/package-mac-app.sh arm64 dist-bin/AirBridge-darwin-arm64 dist-mac
          bash scripts/package-mac-app.sh x64 dist-bin/AirBridge-darwin-x64 dist-mac
          cp dist-mac/AirBridge-macOS-*.zip dist-bin/
          ls -l dist-bin
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-darwin
          path: |
            dist-bin/AirBridge-darwin-*
            dist-bin/AirBridge-macOS-*.zip
          if-no-files-found: error

  android-aab:
    # A public desktop release must never manufacture an unsigned Android
    # substitute. When the private Play upload key is not configured yet, this
    # job completes with a visible "deferred" notice and produces no AAB.
    name: Android App Bundle (Play upload, when configured)
    runs-on: ubuntu-latest
    outputs:
      signed_aab_built: ${{ steps.signing.outputs.configured }}
    steps:
      - name: Configure private Play upload key when available
        id: signing
        env:
          AIRBRIDGE_UPLOAD_KEYSTORE_BASE64: ${{ secrets.AIRBRIDGE_UPLOAD_KEYSTORE_BASE64 }}
          AIRBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.AIRBRIDGE_KEYSTORE_PASSWORD }}
          AIRBRIDGE_KEYSTORE_ALIAS: ${{ secrets.AIRBRIDGE_KEYSTORE_ALIAS }}
          AIRBRIDGE_KEYSTORE_KEY_PASSWORD: ${{ secrets.AIRBRIDGE_KEYSTORE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for key in AIRBRIDGE_UPLOAD_KEYSTORE_BASE64 AIRBRIDGE_KEYSTORE_PASSWORD AIRBRIDGE_KEYSTORE_ALIAS AIRBRIDGE_KEYSTORE_KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Play AAB deferred::No signed Android bundle was built; configure the private Actions secrets before the Play submission. Missing: ${missing[*]}"
            exit 0
          fi
          key_path="$RUNNER_TEMP/airbridge-upload.jks"
          printf '%s' "$AIRBRIDGE_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          test -s "$key_path"
          echo "AIRBRIDGE_KEYSTORE_FILE=$key_path" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: ${{ steps.signing.outputs.configured == 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ steps.signing.outputs.configured == 'true' }}
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: ${{ steps.signing.outputs.configured == 'true' }}
      - uses: actions/setup-java@v4
        if: ${{ steps.signing.outputs.configured == 'true' }}
        with:
          distribution: temurin
          java-version: 17
      # Use the runner image's preinstalled Android SDK (third-party setup
      # actions lag image migrations); install exactly what we compile against.
      - name: Ensure Android SDK components
        if: ${{ steps.signing.outputs.configured == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error title=Android SDK missing::No Android SDK at $SDK_ROOT (ANDROID_HOME=${ANDROID_HOME:-unset})"
            exit 1
          fi
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          if [ -z "$SDKMGR" ]; then
            echo "::error title=sdkmanager missing::No sdkmanager under $SDK_ROOT/cmdline-tools — runner image layout changed"
            exit 1
          fi
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -5
      - uses: gradle/actions/setup-gradle@v4
        if: ${{ steps.signing.outputs.configured == 'true' }}
        with:
          gradle-version: 8.14.3
      - name: Build signed release AAB
        if: ${{ steps.signing.outputs.configured == 'true' }}
        env:
          AIRBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.AIRBRIDGE_KEYSTORE_PASSWORD }}
          AIRBRIDGE_KEYSTORE_ALIAS: ${{ secrets.AIRBRIDGE_KEYSTORE_ALIAS }}
          AIRBRIDGE_KEYSTORE_KEY_PASSWORD: ${{ secrets.AIRBRIDGE_KEYSTORE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          export AIRBRIDGE_VERSION_CODE=$((2300000 + GITHUB_RUN_NUMBER))
          gradle -p android :engine:check --no-daemon 2>&1 | tee gradle-build.log && \
          gradle -p android :app:bundleRelease --no-daemon 2>&1 | tee -a gradle-build.log || {
            echo "::error title=Android App Bundle build failed::$(tail -n 40 gradle-build.log | tr '\n' '|' | cut -c1-3000)"
            exit 1
          }
      - name: Name artifact
        if: ${{ steps.signing.outputs.configured == 'true' }}
        run: mkdir -p dist-bin && cp android/app/build/outputs/bundle/release/app-release.aab dist-bin/AirBridge.aab
      # This is a Play Console upload package, not a direct-download asset.
      # Keep it short-lived and inside Actions; publishing it on a GitHub Release
      # invites users to download an AAB their device cannot install.
      - uses: actions/upload-artifact@v4
        if: ${{ steps.signing.outputs.configured == 'true' }}
        with:
          name: android-aab-play-upload
          path: dist-bin/AirBridge.aab
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [desktop-linux-windows, desktop-darwin, android-aab]
    runs-on: ubuntu-latest
    # Keyless signing: Sigstore build-provenance attestations bound to this
    # workflow run (no signing keys or repository secrets to manage or leak).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      # rollout.mjs (below) runs on a pinned Node, not whatever the image ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Keep the Play AAB in the private, short-lived Actions artifact above.
      # GitHub Releases contain only desktop assets users can actually install.
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist-bin
          merge-multiple: true
      - name: Resolve release tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${INPUT_VERSION:-}"
            if [ -z "$tag" ]; then
              tag="$(node -p "require('./package.json').version")"
            fi
            case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "Resolved release tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Record Android release scope
        id: android-scope
        env:
          SIGNED_AAB_BUILT: ${{ needs.android-aab.outputs.signed_aab_built }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SIGNED_AAB_BUILT" = "true" ]; then
            note="Android: a signed AAB was built as a private Play-upload artifact; it is not a GitHub download."
          else
            note="Android: no Play bundle is included. The private Play upload key is not configured yet, so this public release contains only the validated desktop artifacts."
          fi
          {
            echo "note<<EOF"
            echo "$note"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Checksums
        working-directory: dist-bin
        run: |
          set -euo pipefail
          ls -l
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort \
            | xargs -r sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Staged rollout policy
        # Not in SHA256SUMS on purpose: maintainers re-upload it to halt or
        # widen the rollout (scripts/rollout.mjs). It only decides *when*
        # computers update; what they run is still checked against SHA256SUMS.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          AIRBRIDGE_ROLLOUT_STAGES: ${{ vars.AIRBRIDGE_ROLLOUT_STAGES }}
        run: node scripts/rollout.mjs init "$TAG" --out dist-bin/rollout.json
      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist-bin/AirBridge-*
            dist-bin/SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_SCOPE: ${{ steps.android-scope.outputs.note }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-bin/* --clobber
          else
            gh release create "$TAG" dist-bin/* \
              --target "$GITHUB_SHA" \
              --title "AirBridge $TAG" \
              --generate-notes \
              --notes "${RELEASE_SCOPE}" \
              --latest
          fi
