name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-linux-windows:
    name: Linux + Windows binaries (bun cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Linux targets
        run: node scripts/build-desktop.mjs --only linux
      - name: Build Windows targets (reuse embedded client)
        run: node scripts/build-desktop.mjs --only windows --skip-client
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-windows
          path: |
            dist-bin/AirBridge-linux-*
            dist-bin/AirBridge-windows-*
          if-no-files-found: error

  desktop-darwin:
    name: macOS binaries (ad-hoc signed)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build darwin targets
        run: node scripts/build-desktop.mjs --only darwin
      # Ad-hoc signature: unsigned darwin-arm64 binaries are killed by the
      # kernel on Apple Silicon. This keeps distribution free (no $99/yr
      # Apple Developer account, no notarization).
      - name: Ad-hoc sign
        run: |
          for f in dist-bin/AirBridge-darwin-*; do
            codesign --force -s - "$f"
            codesign --verify --verbose=2 "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-darwin
          path: dist-bin/AirBridge-darwin-*
          if-no-files-found: error

  android-apk:
    name: Android APK (sideload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Assemble release APK (ci sideload key)
        env:
          AIRBRIDGE_VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android :engine:vectorTest :app:assembleRelease --no-daemon
      - name: Name artifact
        run: mkdir -p dist-bin && cp android/app/build/outputs/apk/release/app-release.apk dist-bin/AirBridge.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-bin/AirBridge.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop-linux-windows, desktop-darwin, android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-bin
          merge-multiple: true
      - name: Checksums
        working-directory: dist-bin
        run: sha256sum $(ls | sort) > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-bin/* \
            --title "AirBridge $GITHUB_REF_NAME" \
            --generate-notes
